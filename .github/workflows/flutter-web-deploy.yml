name: Deploy Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Verify API URL secret
        env:
          AGRIN_API_URL: ${{ secrets.AGRIN_API_URL }}
        run: |
          if [ -z "$AGRIN_API_URL" ]; then
            echo "AGRIN_API_URL GitHub secret is required for production deployment."
            exit 1
          fi

      - name: Build Flutter web
        env:
          AGRIN_API_URL: ${{ secrets.AGRIN_API_URL }}
        run: flutter build web --release --base-href /agrin-ai/ --dart-define=AGRIN_API_URL="$AGRIN_API_URL"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
