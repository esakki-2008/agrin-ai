services:
  - type: web
    name: agrin-ai-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY_PRIMARY
        sync: false
      - key: GEMINI_API_KEY_BACKUP
        sync: false
      - key: GEMINI_MODEL_PRIMARY
        value: gemini-2.5-flash
      - key: GEMINI_MODEL_BACKUP
        value: gemini-3.5-flash-lite
      - key: CORS_ORIGINS
        value: https://esakki-2008.github.io
